name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]"
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RTMT-Plus --collect-all PySide6 src/rtmt_plus/desktop_launcher.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/RTMT-Plus.exe)) { throw "Executable missing" }
          Get-Item dist/RTMT-Plus.exe | Select-Object Name,Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RTMT-Plus-Windows-x64
          path: dist/RTMT-Plus.exe
          if-no-files-found: error
          retention-days: 30

  # Each build of main is published as the "latest" release, so anyone can download RTMT-Plus.exe
  # from the Releases page without signing in to GitHub.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RTMT-Plus-Windows-x64
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest RTMT-Plus.exe --target "$GITHUB_SHA" --latest \
            --title "RTMT Plus for Windows (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}; tests passed. Download RTMT-Plus.exe. It is not code-signed."
