[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmt-plus"
version = "0.2.0"
description = "Local-first Cisco CUCM/RTMT log search and correlation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Jake"}]
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
dev = ["pytest>=7.4"]

[project.scripts]
rtmt-plus = "rtmt_plus.cli:main"
rtmt-plus-desktop = "rtmt_plus.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
